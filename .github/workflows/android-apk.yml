name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.4)'
        required: false
        default: 'v0.2.4'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK assets
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          OUT_DIR="release-apks"
          mkdir -p "$OUT_DIR"

          ARM64_APK=$(find android/app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          UNIVERSAL_APK=$(find android/app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)

          FILES=""
          if [ -n "$ARM64_APK" ]; then
            ARM64_OUT="$OUT_DIR/NekoChat-${TAG}-arm64-v8a.apk"
            cp "$ARM64_APK" "$ARM64_OUT"
            FILES="${FILES}${ARM64_OUT}"$'\n'
          fi
          if [ -n "$UNIVERSAL_APK" ]; then
            UNI_OUT="$OUT_DIR/NekoChat-${TAG}-universal.apk"
            cp "$UNIVERSAL_APK" "$UNI_OUT"
            FILES="${FILES}${UNI_OUT}"$'\n'
          fi
          if [ -z "$FILES" ]; then
            FALLBACK_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$FALLBACK_APK" ]; then
              echo "No APK found in android/app/build/outputs/apk/release"
              exit 1
            fi
            FALLBACK_OUT="$OUT_DIR/NekoChat-${TAG}.apk"
            cp "$FALLBACK_APK" "$FALLBACK_OUT"
            FILES="${FALLBACK_OUT}"$'\n'
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf "%s" "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: NekoChat ${{ steps.apk.outputs.tag }}
          body: |
            ## 🐾 NekoChat ${{ steps.apk.outputs.tag }}

            Open-source, zero-login, local-first AI roleplay & companion client.

            ### 📦 Which APK should I install?
            - **`arm64-v8a` (Recommended):** Stripped build for modern 64-bit Android phones — much smaller download and faster install.
            - **`universal`:** Larger fallback build if `arm64-v8a` doesn't install (older 32-bit devices or emulators).

            ### ✨ What's New in v0.2.4
            - **4 Overhauled UI Skins**:
              - **Neko Bento**: Tactile `3.5px` keycap lips, asymmetric Bento Settings grid, balanced contrast bubbles, and a **2×2 Bento Macro-Pad Composer** with a detached Send/Expand stack.
              - **HIG Liquid Glass**: Live Android 12+ GPU blur (`BlurTargetView` + `dimezisBlurViewSdk31Plus`), specular rims, and feathered SVG radial backdrop glows.
              - **Material 3 Expressive**: Dynamic accent-tinted tonal surfaces (`getM3TonalContainer`), Android 16 segmented list geometry, thick expressive sliders, morphing switches, and floating pill composer.
              - **Classic**: Floating frosted glass pills (`+` · `Message here...` · `Send`) that smoothly liquid-merge on focus with frosted chat chrome & bubbles.
            - **100% On-Device Taste Engine (`Settings → For You & Taste`)**:
              - Split local recommendation brain (`tasteEngineLogic.ts` & `tasteEngineService.ts`) with 14-day exponential decay, real Datacat tag-ID catalog fetching, neutral RPG gender-bias fix, Character Focus overrides (`Auto` / `Female` / `Male` / `All`), pinned & muted tags, RP token-depth matching, quick-skip tracking, pause toggle, and reset controls.
            - **One-Tap In-Chat Persona Switcher**:
              - Compact `[Avatar] [Name + Preview] [Check]` persona list inside Chat Room styled faithfully for all 4 skins.
            - **Direct GitHub Releases Update Checker**:
              - Check for new releases and `.apk` assets directly from **Settings → About NekoChat**.
            - **Sheet Ergonomics, Notifications & Security Hardening**:
              - Fixed native Android/iOS scroll hijacking in `BottomSheetModal`, converted `CommunityCharacterModal` & `CreatorProfileModal` into slide-up sheets, added Smart Notifications & Creator Drops inbox, migrated Image Gen API keys into `expo-secure-store`, enforced `http(s)` URL allowlisting, and verified `85/85` passing unit tests.
          generate_release_notes: true
          files: ${{ steps.apk.outputs.files }}
          draft: false
          prerelease: true

