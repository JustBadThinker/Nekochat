name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.3)'
        required: false
        default: 'v0.2.3'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK assets
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          OUT_DIR="release-apks"
          mkdir -p "$OUT_DIR"

          ARM64_APK=$(find android/app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          UNIVERSAL_APK=$(find android/app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)

          FILES=""
          if [ -n "$ARM64_APK" ]; then
            ARM64_OUT="$OUT_DIR/NekoChat-${TAG}-arm64-v8a.apk"
            cp "$ARM64_APK" "$ARM64_OUT"
            FILES="${FILES}${ARM64_OUT}"$'\n'
          fi
          if [ -n "$UNIVERSAL_APK" ]; then
            UNI_OUT="$OUT_DIR/NekoChat-${TAG}-universal.apk"
            cp "$UNIVERSAL_APK" "$UNI_OUT"
            FILES="${FILES}${UNI_OUT}"$'\n'
          fi
          if [ -z "$FILES" ]; then
            FALLBACK_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$FALLBACK_APK" ]; then
              echo "No APK found in android/app/build/outputs/apk/release"
              exit 1
            fi
            FALLBACK_OUT="$OUT_DIR/NekoChat-${TAG}.apk"
            cp "$FALLBACK_APK" "$FALLBACK_OUT"
            FILES="${FALLBACK_OUT}"$'\n'
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf "%s" "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: NekoChat ${{ steps.apk.outputs.tag }}
          body: |
            ## 🐾 NekoChat ${{ steps.apk.outputs.tag }}

            Open-source, zero-login, local-first AI roleplay & companion client.

            ### 📦 Which APK should I install?
            - **`arm64-v8a` (Recommended):** Stripped build for modern 64-bit Android phones — much smaller download and faster install.
            - **`universal`:** Larger fallback build if `arm64-v8a` doesn't install (older 32-bit devices or emulators).

            ### ✨ What's New in v0.2.3
            - **Redesigned UI Theme Packs (Classic, Material You & HIG)**:
              - **Classic**: Removed the `(Janitor)` suffix and rebuilt the skin with neutral charcoal surfaces (`#141414` / `#1E1E1E` / `#262626`), docked bottom navigation (`classic_bar`), and stacked roleplay message blocks without neon glow clutter.
              - **Material You (M3)** & **HIG (iPhone)**: Added authentic dark tonal surfaces (`#111318` / `#1D2026` for M3; true `#000000` / `#1C1C1E` / `#2C2C2E` with `0.5px` hairlines for HIG) wired consistently across all screens, cards, modals, and scrims.
              - Removed leftover hardcoded dark-navy hexes and `modalFooter` backgrounds so every sheet blends seamlessly with the active skin.
            - **Smooth Native-Driver UI Transitions**:
              - Added reusable `SmoothTransition` primitives (`AnimatedCollapsible`, `AnimatedChevron`, `AnimatedTabTransition`, `AnimatedEnterRow`) driven by `skin.animation` on the native UI thread.
              - Wired smooth transitions into My Chats date-group chevrons & Grid/Accordion switches, ChatRoom Thinking Inspector / Advanced controls / Syntax color pickers, Settings Advanced Sampling accordion, User Studio tabs, Discover mode/tab switches, and Character Modal greeting accordions.
            - **Smoother Chat Opening, Scrolling & Keyboard Ergonomics**:
              - Switched initial chat rendering to the **last 6 messages** with a WhatsApp-style fade-in at the bottom, anchored `maintainVisibleContentPosition` for `Tap to see earlier messages`, and a smoother down-arrow scroll-to-bottom action.
              - Fixed Android keyboard auto-scroll bounce and added dynamic bottom safe-area inset padding across modals (`CapabilityMatrixModal`, `CreatorProfileModal`, `StoryViewerModal`, and bottom docks) so controls never hide behind Android's native navigation bar.
            - **Android GPU Performance, Web Parity & Smaller APK Footprint**:
              - Removed live native `BlurView` / `BlurTargetView` passes on Android across the navigation dock, Discover feed, root app wrapper, and chat wallpapers (switching Android wallpaper blur to lightweight static `<Image blurRadius>`), and aligned Chrome/Edge web preview opacities 1:1 with Android native.
              - Added Android ABI-split release builds (`arm64-v8a` + `universal`), uninstalled unused `mysql2`, removed ~9.5 MB of unreferenced sprite assets, and installed `expo-system-ui` to keep root dark backgrounds clean on launch.
            - **Beginner-Friendly Chat Controls & Verification**:
              - Added plain-English helper hints in Chat Controls, grouped power-user options (`Prefill`, `Forbidden words`, `Attached Lorebooks`) under a collapsible **Advanced controls** toggle, and refined the `Easy` Token Optimizer description.
              - Updated Expo SDK 58 patch versions (`expo` `~58.0.26`, `expo-file-system` `~58.0.14`) to pass `expo-doctor` (`20/20`), with `0` TypeScript/ESLint errors and all `62/62` unit tests passing.
          generate_release_notes: true
          files: ${{ steps.apk.outputs.files }}
          draft: false
          prerelease: true

