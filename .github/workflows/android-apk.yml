name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.1)'
        required: false
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK asset
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "No APK found in android/app/build/outputs/apk/release"
            exit 1
          fi
          APK_OUT="NekoChat-${TAG}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: NekoChat ${{ steps.apk.outputs.tag }}
          body: |
            ## 🐾 NekoChat ${{ steps.apk.outputs.tag }}

            Open-source, zero-login, local-first AI roleplay & companion client.

            ### ✨ What's New in v0.2.1
            - **In-App Help Center & Per-Character Lorebooks**: Searchable Help Center (`Settings → Help & Guides`) with illustrated guides, plus per-character **Attached Lorebooks** in Chat Settings and `"What is a Lorebook?"` deep-links.
            - **Thinking Inspector Drawer**: Collapsible translucent `Thinking` window above AI replies showing the sanitized `Nekochat Backend` prompt and `AI Model thinking` (`<think>` / reasoning) with auto-scroll.
            - **Global & Smart Wallpapers**: Extracted `ChatBackgroundLayer` with **Smart Auto-Darken** and an **Apply background to all chats** toggle.
            - **Roleplay Customization**: Message font presets (`Default`, `Serif`, `Mono`, `Light`) and `Standard` (6–9 paragraphs) / `Shorter` (max 5 paragraphs) response length presets.
            - **Discover & Search Polish**: Animated mode dropdown (`Catalog Grid`, `For You`, `Match Mode`), smart `#tag` + alias search (`#dominance`, `#ntr`, `#noncon`, etc.), Chub.ai & Datacat source links, and inline gallery lightbox.
            - **Dynamic Cast Upgrade**: Extracts multi-character card members as one-tap `+ Name` chips and supports **RPG / Narrator Mode** for world/scenario cards.
            - **Smooth Motion**: Added ease-in/ease-out transitions and swipe-to-dismiss sheets across modals, accordions, and dropdowns.
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
          draft: false
          prerelease: true

