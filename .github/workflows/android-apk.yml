name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.2)'
        required: false
        default: 'v0.2.2'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK asset
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "No APK found in android/app/build/outputs/apk/release"
            exit 1
          fi
          APK_OUT="NekoChat-${TAG}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: NekoChat ${{ steps.apk.outputs.tag }}
          body: |
            ## 🐾 NekoChat ${{ steps.apk.outputs.tag }}

            Open-source, zero-login, local-first AI roleplay & companion client.

            ### ✨ What's New in v0.2.2
            - **4-Tier Token Stripper & Live Visual Preview**: Added `Off / Easy / Medium / Aggressive` pre-send context optimization in Chat Settings with a scrollable color-coded preview (`Kept`, `Stripped`, `Compressed`), RP integrity tips, and one-tap Auto-Memory enablement.
            - **Streaming Reliability & Provider Diagnostics**: Added SSE stream instrumentation, Gemini trailing-buffer flushing, `finishReason` + token usage reporting in the `Thinking` inspector (`Cut:` badge on abnormal stops), buffered-reply warning, and opt-in `Animate non-streamed replies` with instant `Show all`.
            - **Capability Matrix & Lorebook Engine**: Added provider/model capability testing (`CapabilityMatrixModal`) and upgraded lorebook matching, budget enforcement, and diagnostic reporting.
            - **ChatRoom Performance & UX**: Switched message history to virtualized `FlatList` + `React.memo` rows + 45ms stream throttling, added left/right swipe-to-regenerate, smart newline handling on **Continue**, smooth `Animated.timing` composer expand/collapse, and web auto-resize after **Write for me** / **Refine**.
            - **My Chats & Discover Polish**: Upgraded **My Chats** to a 3-column date-grouped grid (`Today`, `Yesterday`, exact date, `New Cards`) with auto-collapsed older groups; updated TikTok **For You** mode to a 1-card full-bleed bottom overlay; and memoized/cached card styles on `BentoChatCard` & `CommunityCharacterCard`.
            - **8×10 Pixel Kitten Companion**: Upgraded `DeskNekoWalker` and `NekoPetSprite` to the full `8×10` transparent sprite sheet with native left/right walking, run, hop, groom, wave, stretch, varied sleep poses, and fall-onto-pillow → jump-off → pillow-poof animations.
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
          draft: false
          prerelease: true

